{% extends 'base.html' %}

{% block content %}

<style>
    .card {
        background: linear-gradient(135deg, #3F51B5, #5C6BC0);
        border-radius: 1.5rem;
        height: 10rem;
        padding: 1.5rem;
        transition: transform .1s ease;
        font-size: 1.2rem;
    }
    .card:hover {
        transform: scale(1.02);
    }
</style>
<div class="col-10 ms-3">
    <div class="row m-2">
        {% for value in values %}
        <div class="col-md-3 col-sm-6 forms">
            {% if value.no == '1.1' %}
                <a href = "{% url 'editProfile' %}" style = "text-decoration: None;" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="{{ value.tooltip }}">
                    <div class="card text-white text-center mt-3" style = "width: 100%">
                        <h5 class="card-title">Form 1.1</h5>
                        <p class = "mt-3 mb-0">{{value.form}}</p>                               
                    </div>
                </a>
            {% else %}
                <a href = "/all_forms/{{value.no}}" style = "text-decoration: None;" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="{{value.tooltip}}" >
                    <div class="card text-white text-center mt-3" style = "width: 100%">
                        <h5 class="card-title">Form {{ value.no_ }}</h5>
                        <p class = "mt-3 mb-0">{{value.form}}</p>
                    </div>
                </a>
            {% endif %}   
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
