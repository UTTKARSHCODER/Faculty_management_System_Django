{% extends 'base.html' %}
{% block content %}

 <style>
  html, body {
    max-width: 100%;
    overflow-x: hidden;
    margin: 0;
    padding: 0;
}

.puc {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: #96896e;
    color: #18181b;
    min-height: 60vh;
    display: flex;
    padding: 0;
    margin: 0;
    align-items: center;
    /* width: 100%; */
   max-width: 87.7%;
   /* right: 0; */
   
}

.construction_wrapper {
    position: relative;
    width: 100%;
    max-width: 1100px;
    padding: 90px 20px;
}

.caution-tape {
    background: repeating-linear-gradient(
        -45deg,
        #facc15,
        #facc15 30px,
        #18181b 30px,
        #18181b 60px
    );
    height: 14px;
    width: 116.76%;
    position: absolute;
    left: 0;
    right: 0;
    z-index: 10;
}

.tape-top { top: 0; }
.tape-bottom { bottom: 0; }

.status-pill {
    background: #f4f4f5;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
}

.pulse-dot {
    width: 10px;
    height: 10px;
    background: #facc15;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.6; }
    100% { transform: scale(1); opacity: 1; }
}
</style> 




<div class="container-fluid puc">
    <div class="construction_wrapper text-center">

        <div class="caution-tape tape-top"></div>
        
        <!-- SVG -->
        <div class="mb-5" style = "justify-content: center;">
            <!-- same SVG -->
            <svg width="240" height="180" viewBox="0 0 240 180" fill="none"
                 xmlns="http://www.w3.org/2000/svg">
                <path d="M60 160L90 40M180 160L150 40" stroke="#27272a" stroke-width="8" stroke-linecap="round"/>
                <path d="M40 160L70 40M200 160L170 40" stroke="#52525b" stroke-width="8" stroke-linecap="round"/>
                <rect x="20" y="40" width="200" height="45" rx="2"
                      fill="#facc15" stroke="#18181b" stroke-width="4"/>
                <clipPath id="stripes">
                    <rect x="20" y="40" width="200" height="45" rx="2"/>
                </clipPath>
                <g clip-path="url(#stripes)">
                    <path d="M30 30L70 90M80 30L120 90M130 30L170 90M180 30L220 90"
                          stroke="#18181b" stroke-width="15"/>
                </g>
            </svg>
        </div>

        <!-- Text -->
        <h1 class="display-4 fw-bold fst-italic text-uppercase mb-4">
            Page Under<br>
            <span class="text-warning">Construction</span>
        </h1>

        <div class="mx-auto mb-4" style="height:6px;width:80px;background:#18181b;border-radius:5px;"></div>

        <p class="text-muted fs-5 mx-auto" style="max-width:420px;">
            I'm currently putting in the hard work to upgrade this space.
            Please check back soon!
        </p>

        <!-- Status -->
        <div class="d-inline-flex align-items-center gap-2 px-4 py-2 status-pill mt-4">
            <span class="pulse-dot"></span>
            Development In Progress
        </div>

        <div class="caution-tape tape-bottom"></div>

    </div>
</div>

{% endblock %}
