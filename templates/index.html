{% extends 'base.html' %}

{% block content %}

<style>
   
    
    .card {
        background: linear-gradient(135deg, #3F51B5, #5C6BC0);
        border-radius: 1.5rem;
        height: 10rem;
        padding: 1.3rem;
        transition: transform .1s ease;
        font-size: 1.2rem;
    }
   
    
</style>
<div class="col-10">
    <div class="container">
        <div class="row mb-3 " style="margin-left: 1.1rem;">
            {% for ins in dir_ins %}
            <div class="col-md-4 col-sm-6">
                <a href = "/faculty/{{ins.department}}" style = "text-decoration: None;"><div class="card text-white text-center mt-3" style = "width: 100%">
                    <p class = "mt-3 mb-0">{{ins.department}}</p>
                    <p>{{ins.count}} Teachers</p>
                </div></a>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

{% endblock %}
