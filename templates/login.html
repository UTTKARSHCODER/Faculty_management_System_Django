<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Information Website</title>
    <link rel = "icon" type = "image/png" href = "/static/top-head-logo.png">

    <!-- <link rel="stylesheet" href="responsive.css"> -->
    <!-- Latest compiled and minified CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://kit.fontawesome.com/217508c9b2.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<style>
        .google-login-button {
            width: 500px;
            height: 205px;
            padding: 25px;
            padding-top: 20px;
            margin-top: 200px;
            border: 3px solid purple;
             /* border-color:  3px rgb(191, 92, 191); */

            border-radius: 10px;
            /* background: linear-gradient(
      rgba(128, 0, 128, 0.6),
     rgba(75, 0, 130, 0.6)
     ); */
        .g_id_signin {
            display: none;
            margin-top: 15px;
        }

    </style>
<body>
    <div class="row">
        <div class="col-12 d-flex justify-content-center align-items-center">
            <div class="google-login-button">
                <h2>Welcome User! Please Log in.</h2>
                <div class="col-md-4">
                    <div class="row align-items-center">
                        <label class="col-sm-8 col-form-label">Please Select your post<span class="ms-1" style="color: red;">*</span></label>
                        <div class="col-sm-4">
                            <div class="d-flex column-gap-4">
                                <div class="form-check">
                                    <input type="radio" class="form-check-input" id="radio9-${i}" name="optradio" value="spa" required>
                                    <label class="form-check-label" for="radio9-${i}">SuperAdmin</label>
                                </div>
                                <div class="form-check">
                                    <input type="radio" class="form-check-input" id="radio10-${i}" name="optradio" value="ad">
                                    <label class="form-check-label" for="radio10-${i}">Admin</label>
                                </div>
                                <div class="form-check">
                                    <input type="radio" class="form-check-input" id="radio11-${i}" name="optradio" value="fa">
                                    <label class="form-check-label" for="radio11-${i}">Faculty</label>
                                </div>
                            </div>
                            <div class="invalid-feedback">Please select a category.</div>
                        </div>
                    </div>
                </div>
                <div id="g_id_onload"
                    data-client_id="452004658-dh7oqasukk9hd42g0v09q9ep8ob5pc5i.apps.googleusercontent.com"
                    data-callback="handleCredentialResponse" data-cancel_on_tap_outside="false"
                    data-prompt_parent_id="g_id_onload">
                </div>

                <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"
                    data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left">
                </div>
            </div>
        </div>
    </div>
    <script>
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        };

        var myKeyValue = "None";

        $(document).ready(function() {
            // Listen for a change on any radio button with the name 'optradio'
            $('input[name="optradio"]').on('change', function() {
                myKeyValue = $(this).val();
                $(".g_id_signin").show();
            });
        });

        function handleCredentialResponse(response) {
              // 1. Get the Google-issued JWT token
              const idToken = response.credential;
              // 2. Send the token to your Django backend via AJAX (Fetch API)
              fetch('/auth/google/gsi-verify/', { // <-- Update this URL to your Django endpoint
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'X-CSRFToken': getCookie('csrftoken') // Function to get CSRF token (see below)
                },
                body: JSON.stringify({ 'id_token': idToken, 'post_value' : myKeyValue })
              })
              .then(response => response.json())
              .then(data => {
                if (data.success) {
                  window.location.href = data.redirect_url || '/profile/'; // Success redirect
                } else {
                  alert('Login Failed: ' + data.error);
                }
              })
              .catch(error => console.error('Error during login:', error));
            }

            // Helper function to get the CSRF token from cookies
            function getCookie(name) {
              let cookieValue = null;
              if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                  const cookie = cookies[i].trim();
                  if (cookie.startsWith(name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                  }
                }
              }
              return cookieValue;
            }
    </script>
</body>
</html>
