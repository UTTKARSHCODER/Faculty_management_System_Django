<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Faculty Information Portal</title>
  <link rel="icon" type="image/png" href="/static/top-head-logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://kit.fontawesome.com/217508c9b2.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<style>
  * { box-sizing: border-box; }

  body {
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  /* subtle dot pattern on white bg */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image: radial-gradient(circle, #e5e7eb 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  /* card */
  .login-card {
    position: relative; z-index: 1;
    width: 480px;
    background: #ffffff;
    border: 1.5px solid #e5e7eb;
    border-radius: 20px;
    padding: 44px 40px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.04), 0 20px 50px rgba(0,0,0,0.08);
    animation: slideUp 0.55s cubic-bezier(0.16,1,0.3,1) forwards;
    opacity: 0; transform: translateY(20px);
  }

  @keyframes slideUp {
    to { opacity:1; transform:translateY(0); }
  }

  /* top strip */
  .card-top-strip {
    height: 4px;
    background: linear-gradient(90deg, #7c3aed, #a855f7, #ec4899);
    border-radius: 20px 20px 0 0;
    position: absolute; top: 0; left: 0; right: 0;
  }

  /* logo area */
  .logo-area {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 6px;
  }
  .logo-icon {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 1rem;
    box-shadow: 0 4px 12px rgba(124,58,237,0.3);
  }
  .logo-name {
    font-size: 0.8rem; font-weight: 600;
    color: #7c3aed; letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .card-title {
    font-size: 1.55rem; font-weight: 700;
    color: #111827; letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .card-sub {
    font-size: 0.82rem; color: #9ca3af;
    margin-bottom: 28px;
  }

  .section-label {
    font-size: 0.72rem; font-weight: 600;
    color: #6b7280; letter-spacing: 0.09em;
    text-transform: uppercase; margin-bottom: 10px;
  }
  .section-label span { color: #ef4444; }

  /* hide real radio */
  .role-option input[type="radio"] { display: none; }

  /* role card */
  .role-card {
    display: flex; align-items: center; gap: 13px;
    padding: 13px 16px;
    border: 1.5px solid #f3f4f6;
    border-radius: 12px; cursor: pointer;
    background: #fafafa;
    transition: all 0.2s ease;
    margin-bottom: 8px;
  }
  .role-card:hover {
    border-color: #c4b5fd;
    background: #faf5ff;
    transform: translateX(3px);
  }
  .role-option input:checked + .role-card {
    border-color: #7c3aed;
    background: #f5f3ff;
    box-shadow: 0 0 0 3px rgba(124,58,237,0.08);
  }

  .role-icon-box {
    width: 38px; height: 38px; border-radius: 9px;
    background: #f3f4f6;
    border: 1.5px solid #e5e7eb;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.95rem; color: #9ca3af;
    flex-shrink: 0; transition: all 0.2s;
  }
  .role-option input:checked + .role-card .role-icon-box {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    border-color: transparent; color: white;
    box-shadow: 0 4px 12px rgba(124,58,237,0.35);
  }

  .role-info { flex: 1; }
  .role-name {
    font-size: 0.88rem; font-weight: 600;
    color: #374151; display: block; margin-bottom: 1px;
    transition: color 0.2s;
  }
  .role-option input:checked + .role-card .role-name { color: #6d28d9; }
  .role-desc {
    font-size: 0.7rem; color: #d1d5db;
    transition: color 0.2s;
  }
  .role-option input:checked + .role-card .role-desc { color: #a78bfa; }

  /* radio circle */
  .role-radio-circle {
    width: 19px; height: 19px; border-radius: 50%;
    border: 2px solid #d1d5db;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s;
  }
  .role-radio-circle::after {
    content: ""; width: 8px; height: 8px;
    border-radius: 50%; background: #7c3aed;
    opacity: 0; transform: scale(0);
    transition: all 0.2s ease;
  }
  .role-option input:checked + .role-card .role-radio-circle {
    border-color: #7c3aed;
  }
  .role-option input:checked + .role-card .role-radio-circle::after {
    opacity: 1; transform: scale(1);
  }

  /* divider */
  .or-row {
    display: flex; align-items: center; gap: 12px;
    margin: 20px 0 16px;
  }
  .or-line { flex:1; height:1px; background:#f3f4f6; }
  .or-text { font-size: 0.7rem; color: #d1d5db; font-weight: 500; letter-spacing: 0.08em; }

  /* google btn */
  .g-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 12px;
    border: 1.5px solid #e5e7eb; border-radius: 12px;
    background: #fff; cursor: pointer;
    transition: all 0.2s ease; text-decoration: none;
    animation: none;
  }
  .g-btn:hover {
    border-color: #c4b5fd; background: #faf5ff;
    box-shadow: 0 4px 14px rgba(124,58,237,0.1);
    transform: translateY(-1px);
  }
  .g-btn span {
    font-size: 0.88rem; font-weight: 500;
    color: #374151; font-family: 'Plus Jakarta Sans', sans-serif;
  }

  /* hidden google widget */
  .g_id_signin { display: none; margin-top: 15px; }

  /* selected role pill */
  .selected-pill {
    display: none;
    align-items: center; gap: 6px;
    background: #f5f3ff; border: 1px solid #c4b5fd;
    border-radius: 20px; padding: 4px 12px;
    font-size: 0.72rem; font-weight: 600;
    color: #7c3aed; margin-bottom: 16px;
    animation: popIn 0.25s ease;
  }
  .selected-pill.show { display: inline-flex; }
  @keyframes popIn {
    from { transform: scale(0.85); opacity:0; }
    to   { transform: scale(1);    opacity:1; }
  }

  /* footer */
  .card-footer-note {
    text-align: center; margin-top: 20px;
    font-size: 0.68rem; color: #d1d5db; letter-spacing: 0.04em;
  }
</style>

<body>
  <div class="row w-100 justify-content-center align-items-center" style="min-height:100vh;">
    <div class="col-auto">
      <div class="login-card">
        <div class="card-top-strip"></div>

        <!-- logo -->
        <div class="logo-area">
          <div class="logo-icon"><i class="bi bi-mortarboard-fill"></i></div>
          <span class="logo-name">FACULTY INFORMATION PORTAL</span>
        </div>

        <!-- title -->
        <p class="card-sub">Please select your role and sign in to continue.</p>

        <!-- selected pill -->
        <div class="selected-pill" id="selectedPill">
          <i class="bi bi-check-circle-fill"></i>
          <span id="pillText">Role selected</span>
        </div>

        <!-- role label -->
        <p class="section-label">PLEASE Select your post <span>*</span></p>

        <!-- super admin -->
        <div class="role-option">
          <input type="radio" class="form-check-input" id="radio9-${i}" name="optradio" value="spa" required>
          <label class="role-card" for="radio9-${i}">
            <div class="role-icon-box"><i class="bi bi-shield-lock-fill"></i></div>
            <div class="role-info">
              <span class="role-name" style="font-weight: 900;">Super Admin</span>
              <span class="role-desc" style="color: black; font-weight: 500;">Full system control & privileges</span>
            </div>
            <div class="role-radio-circle"></div>
          </label>
        </div>

        <!-- admin -->
        <div class="role-option">
          <input type="radio" class="form-check-input" id="radio10-${i}" name="optradio" value="ad">
          <label class="role-card" for="radio10-${i}">
            <div class="role-icon-box"><i class="bi bi-person-gear"></i></div>
            <div class="role-info">
              <span class="role-name" style="font-weight: 900;">Admin</span>
              <span class="role-desc" style="color: black; font-weight: 500;">Manage users & institutional data</span>
            </div>
            <div class="role-radio-circle"></div>
          </label>
        </div>

        <!-- faculty -->
        <div class="role-option">
          <input type="radio" class="form-check-input" id="radio11-${i}" name="optradio" value="fa">
          <label class="role-card" for="radio11-${i}">
            <div class="role-icon-box"><i class="bi bi-journal-text"></i></div>
            <div class="role-info">
              <span class="role-name" style="font-weight: 900;">Faculty</span>
              <span class="role-desc" style="color: black; font-weight: 500;">Faculty Data Collection & Progress Tracking</span>
            </div>
            <div class="role-radio-circle"></div>
          </label>
        </div>

        <div class="invalid-feedback d-block" id="roleError" style="display:none !important; font-size:0.75rem; font-weight: 900; color: black">
          <h6>Please select a role to continue.</h6>
        </div>

        <!-- or divider -->
        <div class="or-row">
          <div class="or-line"></div>
          <span class="or-text" style="font-weight: 900; color: black">THEN CONTINUE WITH</span>
          <div class="or-line"></div>
        </div>

        <!-- google sign in -->
        <div id="g_id_onload"
          data-client_id="452004658-dh7oqasukk9hd42g0v09q9ep8ob5pc5i.apps.googleusercontent.com"
          data-callback="handleCredentialResponse"
          data-cancel_on_tap_outside="false"
          data-prompt_parent_id="g_id_onload">
        </div>

        <div class="g_id_signin"
          data-type="standard" data-size="large"
          data-theme="outline" data-text="sign_in_with"
          data-shape="rectangular" data-logo_alignment="left">
        </div>

        <!-- footer -->
        <p class="card-footer-note " style="color: #111827;">
          <i class="bi bi-lock-fill me-1"></i>
          Protected by institutional SSO · All access is logged
        </p>
      </div>
    </div>
  </div>

<script>
  function getUrlParameter(name) {
    name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
    var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
    var results = regex.exec(location.search);
    return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
  }

  var myKeyValue = "None";

  const roleNames = { spa: "Super Admin", ad: "Admin", fa: "Faculty" };
  const roleIcons = { spa: "bi-shield-lock-fill", ad: "bi-person-gear", fa: "bi-journal-text" };

  $(document).ready(function () {
    $('input[name="optradio"]').on('change', function () {
      myKeyValue = $(this).val();
      $(".g_id_signin").show();

      // show pill
      const pill = document.getElementById("selectedPill");
      const pillText = document.getElementById("pillText");
      pillText.textContent = roleNames[myKeyValue] + " selected";
      pill.classList.remove("show");
      void pill.offsetWidth; // reflow for animation
      pill.classList.add("show");

      // hide error
      $("#roleError").hide();
    });

    // google trigger btn
    $("#googleTriggerBtn").on("click", function () {
      if (myKeyValue === "None") {
        $("#roleError").show();
        // shake card
        $(".login-card").css("animation","none").css("transform","translateX(-7px)");
        setTimeout(() => $(".login-card").css("transform","translateX(7px)"), 80);
        setTimeout(() => $(".login-card").css("transform","translateX(0)"), 160);
      } else {
        // trigger the hidden google button
        $(".g_id_signin").find("div[role='button']").click();
      }
    });
  });

  function handleCredentialResponse(response) {
    const idToken = response.credential;
    fetch('/auth/google/gsi-verify/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken')
      },
      body: JSON.stringify({ 'id_token': idToken, 'post_value': myKeyValue })
    })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        window.location.href = data.redirect_url || '/profile/';
      } else {
        alert('Login Failed: ' + data.error);
      }
    })
    .catch(error => console.error('Error during login:', error));
  }

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.startsWith(name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }
</script>
</body>
</html>
